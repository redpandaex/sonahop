[package]
name = "sonahop-ui"
version = "0.4.2"
description = "SonaHop desktop and Android interface"
authors = ["redpandaex"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sonahop_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonahop-link = { version = "0.1.0", path = "../../../crates/sonahop-link" }
tauri-plugin-sonahop-lan = { version = "0.1.0", path = "../../../crates/tauri-plugin-sonahop-lan" }
sonahop-audio = { version = "0.1.0", path = "../../../crates/sonahop-audio" }
sonahop-core = { version = "0.1.0", path = "../../../crates/sonahop-core" }
tokio = { version = "=1.52.0", features = ["sync", "rt", "time", "macros"] }

[target."cfg(windows)".dependencies]
sonahop-platform-windows = { version = "0.1.0", path = "../../../crates/sonahop-platform-windows" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
