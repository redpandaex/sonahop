[package]
name = "sonahop-link"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
hkdf = "0.12"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.10"
socket2 = "0.6"
spake2 = "0.4"
tokio = { version = "=1.52.0", features = ["rt", "sync", "net", "time", "io-util", "macros"] }
uuid = { version = "1.26.1", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }
