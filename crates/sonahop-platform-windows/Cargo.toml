[package]
name = "sonahop-platform-windows"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
sonahop-core = { version = "0.1.0", path = "../sonahop-core" }

[target."cfg(windows)".dependencies]
wasapi = "0.25.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_Security", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-core = "0.62.2"
