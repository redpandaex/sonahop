[package]
name = "tauri-plugin-sonahop-lan"
version = "0.1.0"
authors = [ "redpandaex" ]
description = "Android local-network permission adapter for SonaHop"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-sonahop-lan"

[dependencies]
tauri = "=2.11.6"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
serde_json = "1.0.152"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
