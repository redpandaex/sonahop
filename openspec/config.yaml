schema: spec-driven

context: |
  Language: zh-CN.
  Write artifact content in Chinese; keep structural headings and SHALL/MUST keywords in English.
  SonaHop is a new, independent, open-source audio streaming project with a shared Rust core and Tauri UI.
  The repository currently has OpenSpec configuration and no application implementation.
  Use Windows, Linux, macOS, and Android adapters around shared Rust interfaces; initial implementation and verification cover Windows 11 and Android 16 only.
  Confirmed first milestone: Windows PC audio to two Android listeners simultaneously, or one selected Android microphone to a Windows virtual audio input. The two modes are mutually exclusive; microphone mode pauses all listening streams.
  Test devices supplied by the owner: this Windows 11 PC, Xiaomi 17 Pro Max on Android 16, and Lenovo Y700 generation 4 on Android 16; both Android devices can connect by USB for deployment and diagnostics.
  Initial microphone support integrates an existing user-installed virtual audio device. A project-owned audio driver is a later milestone.
  Prefer official CLI scaffolding and dependency commands: cargo new/add/remove, pnpm create/add/remove, and OpenSpec CLI. Only edit configuration manually for settings the CLI does not cover.
  Do not use SoundPush as an implementation or architecture reference.
  Ask the owner before resolving material uncertainty about scope, externally visible behavior, compatibility, or acceptance criteria. Make and document routine technical choices.
  Start with fixed codec parameters and bounded buffers plus basic metrics. Adaptive bitrate, full duplex, multiroom synchronization, Internet traversal, and new drivers are future changes.
  USB availability is a testing/deployment capability; it does not by itself promise USB audio transport in this milestone.

rules:
  proposal:
    - Describe the observable milestone and clearly list deferred features.
    - Distinguish confirmed owner decisions from implementation proposals and unverified hardware behavior.
  specs:
    - Use ADDED Requirements and English Requirement and Scenario headings with Chinese content and explicit SHALL or MUST requirements.
    - Make mode exclusion, two-listener isolation, permission handling, and external virtual-device setup testable.
  design:
    - Include shared-core dependency boundaries, lifecycle and thread ownership, data flow, protocol and pairing, and the physical-device verification matrix.
    - Treat bitrate and buffer defaults as initial engineering parameters, not measured performance claims.
  tasks:
    - Provide ordered, unchecked implementation tasks and separate automated verification from owner-assisted physical-device acceptance.
    - Include CLI scaffolding and dependency management and record actual results before checking tasks off.
